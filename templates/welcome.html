<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body style="margin: 0; padding: 0; font-family: Arial, sans-serif">
    <table border="0" cellpadding="0" cellspacing="0" width="100%">
      <tr>
        <td align="center" style="padding: 20px 0 30px 0">
          <table
            border="0"
            cellpadding="0"
            cellspacing="0"
            width="600"
            style="
              border-collapse: collapse;
              background-color: #ffffff;
              border-radius: 8px;
              box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
            "
          >
            <tr>
              <td
                align="center"
                style="
                  padding: 40px 0 30px 0;
                  background-color: #007bff;
                  border-top-left-radius: 8px;
                  border-top-right-radius: 8px;
                "
              >
                <h1 style="color: #ffffff; font-size: 28px; margin: 0">
                  Coding Works
                </h1>
              </td>
            </tr>
            <tr>
              <td style="padding: 40px 30px 40px 30px">
                <table border="0" cellpadding="0" cellspacing="0" width="100%">
                  <tr>
                    <td
                      style="
                        color: #333333;
                        font-family: Arial, sans-serif;
                        font-size: 16px;
                      "
                    >
                      <h2
                        style="color: #007bff; font-size: 18px; margin-top: 0"
                      >
                        Hello Gaurav
                      </h2>
                      <p
                        style="
                          margin-bottom: 20px;
                          line-height: 1.6;
                          text-align: justify;
                        "
                      >
                        A massive welcome to our community! We are thrilled to
                        have you join us at Coding Works.

                        Below is the message you sent us:
                        <blockquote
                          style="
                            margin: 20px 0;
                            padding: 15px;
                            background-color: #f8f9fa;
                            border-left: 4px solid #007bff;
                          "
                        >
                          {{message}}
                        </blockquote>

                      </p>

                      <p
                        style="
                          font-weight: bold;
                          margin-bottom: 15px;
                          text-align: justify;
                        "
                      >
                        To get started, click the button below:
                      </p>
                    </td>
                  </tr>
                  <tr>
                    <td align="center" style="padding: 20px 0">
                      <table border="0" cellpadding="0" cellspacing="0">
                        <tr>
                          <td
                            align="center"
                            style="border-radius: 6px"
                            bgcolor="#28a745"
                          >
                            <a
                              href="https://www.sgaurav.me"
                              target="_blank"
                              style="
                                font-size: 18px;
                                font-family: Arial, sans-serif;
                                color: #ffffff;
                                text-decoration: none;
                                padding: 12px 25px;
                                border-radius: 6px;
                                border: 1px solid #28a745;
                                display: inline-block;
                              "
                            >
                              Get Started Now!
                            </a>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                  <tr>
                    <td
                      style="
                        color: #333333;
                        font-family: Arial, sans-serif;
                        font-size: 16px;
                      "
                    >
                      <p style="margin-top: 5px; font-weight: bold">
                        The Coding Works Team
                      </p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 30px 30px;
                  background-color: #e9ecef;
                  border-bottom-left-radius: 8px;
                  border-bottom-right-radius: 8px;
                "
              >
                <p
                  style="
                    color: #6c757d;
                    font-size: 10px;
                    text-align: center;
                    margin: 0;
                  "
                >
                  Coding Works &copy; 2025 All rights are reserved
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
